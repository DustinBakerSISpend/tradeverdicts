# TradeVerdicts production launch controls.
# These values are non-secret and intentionally scoped only to production deploys.
[context.production]
  environment = { NBA_PUBLIC_ENABLED = "0", NBA_INDEX_ENABLED = "0", NBA_ADS_ENABLED = "0" }

# NFL-only release guard: keep the in-progress NBA preview tree unreachable in
# production while preserving the local/private NBA build workflow.
[[redirects]]
  from = "/nba/*"
  to = "/404.html"
  status = 404
  force = true
